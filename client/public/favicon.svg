<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC2E2" />
      <stop offset="50%" stop-color="#FF8FC7" />
      <stop offset="100%" stop-color="#FF5C85" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8" />
      <stop offset="100%" stop-color="#FFC2E2" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#542743" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ticket Body with Notches -->
  <path
    d="M 22 14
       C 15 14, 10 19, 10 26
       L 10 50
       A 10 10 0 0 1 10 70
       L 10 94
       C 10 101, 15 106, 22 106
       L 98 106
       C 105 106, 110 101, 110 94
       L 110 70
       A 10 10 0 0 1 110 50
       L 110 26
       C 110 19, 105 14, 98 14
       Z"
    fill="url(#ticketGrad)"
    stroke="#542743"
    stroke-width="4.5"
    filter="url(#softGlow)"
  />

  <!-- Perforated dashed divider line -->
  <line x1="42" y1="20" x2="42" y2="100" stroke="#FFF9FC" stroke-width="3" stroke-dasharray="4,4" stroke-linecap="round" opacity="0.85" />

  <!-- Film strip / Reel punch holes on left stub -->
  <rect x="20" y="24" width="8" height="10" rx="3" fill="#FFF9FC" opacity="0.9" />
  <rect x="20" y="44" width="8" height="10" rx="3" fill="#FFF9FC" opacity="0.9" />
  <rect x="20" y="66" width="8" height="10" rx="3" fill="#FFF9FC" opacity="0.9" />
  <rect x="20" y="86" width="8" height="10" rx="3" fill="#FFF9FC" opacity="0.9" />

  <!-- Center Heart Motif -->
  <path
    d="M 76 42
       C 70 33, 56 36, 56 48
       C 56 61, 74 74, 76 76
       C 78 74, 96 61, 96 48
       C 96 36, 82 33, 76 42
       Z"
    fill="#FFF9FC"
    stroke="#542743"
    stroke-width="3.5"
  />

  <!-- Sparkle star top right -->
  <path
    d="M 94 22 Q 97 28 102 30 Q 97 32 94 38 Q 92 32 86 30 Q 92 28 94 22 Z"
    fill="#FFF0A8"
    stroke="#542743"
    stroke-width="1.5"
  />

  <!-- Mini sparkle bottom right -->
  <circle cx="92" cy="88" r="3" fill="#FFF0A8" />
  <circle cx="62" cy="88" r="2.5" fill="#FFF9FC" />
</svg>
